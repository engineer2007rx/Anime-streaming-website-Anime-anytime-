<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Anime Anytime — Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="./style.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0f14;
      --card:      #13161e;
      --card-border: rgba(255,255,255,0.07);
      --input-bg:  #1a1d27;
      --input-border: #2a2d3a;
      --input-focus: #ff6b1a;
      --accent:    #ff6b1a;
      --accent2:   #e84040;
      --text:      #f0f0f0;
      --muted:     #7a7f94;
      --divider:   rgba(255,255,255,0.08);
    }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .page {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 460px;
    }

    .hero {
      position: relative;
      background: #0a0c12;
      display: flex;
      align-items: flex-end;
      padding: 48px;
      overflow: hidden;
    }

    .hero-bg-placeholder {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(135deg, rgba(232,64,64,0.12) 0%, transparent 50%),
        linear-gradient(to right, transparent 60%, rgba(13,15,20,0.9) 100%);
      z-index: 1;
    }

    .hero-label {
      position: relative;
      z-index: 2;
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(48px, 7vw, 96px);
      line-height: 0.95;
      letter-spacing: 0.03em;
      color: rgba(255,255,255,0.08);
      text-transform: uppercase;
      user-select: none;
      pointer-events: none;
    }

    .card-wrap {
      background: var(--card);
      border-left: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 56px 44px;
    }

    .logo {
      display: flex;
      align-items: baseline;
      gap: 4px;
      margin-bottom: 36px;
    }
    .logo-main {
      font-weight: 700;
      font-size: 28px;
      color: var(--accent);
      letter-spacing: -0.5px;
    }
    .logo-sub {
      font-size: 15px;
      font-weight: 500;
      color: #e84040;
      letter-spacing: 0.5px;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 6px;
    }
    .sub {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 32px;
    }

    .field { margin-bottom: 18px; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #c8cad4;
      margin-bottom: 7px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--muted);
      pointer-events: none;
      display: flex;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      padding: 13px 44px;
      color: var(--text);
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    input::placeholder { color: var(--muted); }
    input:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 3px rgba(255,107,26,0.12);
    }

    .eye-btn {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      padding: 4px;
      transition: color .15s;
    }
    .eye-btn:hover { color: var(--text); }

    .row-forgot {
      display: flex;
      justify-content: flex-end;
      margin: -6px 0 24px;
    }
    .link-orange {
      font-size: 13px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    .link-orange:hover { text-decoration: underline; }

    .btn-signin {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #ff6b1a 0%, #e84040 100%);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: opacity .2s, transform .15s;
    }
    .btn-signin:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-signin:active { transform: translateY(0); }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
      color: var(--muted);
      font-size: 12px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--divider);
    }

    .socials {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 28px;
    }
    .btn-social {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      padding: 11px;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    .btn-social:hover {
      border-color: rgba(255,255,255,0.18);
      background: #1f2230;
    }

    .signup-row {
      text-align: center;
      font-size: 13.5px;
      color: var(--muted);
    }
    .signup-row a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .signup-row a:hover { text-decoration: underline; }

    @media (max-width: 768px) {
      .page { grid-template-columns: 1fr; }
      .hero { display: none; }
      .card-wrap { padding: 40px 28px; }
    }
  </style>
</head>
<body>
<div class="page">

 <div class="hero">
  <!-- 👇 ADD THIS VIDEO TAG -->
  <video autoplay muted loop playsinline style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0;">
    <source src="./vidssave.com THIS IS 4K ANIME _ YOUR NAME 2160P 60FPS 1080P.mp4" type="video/mp4">
  </video>

  <div class="hero-bg-placeholder"></div>
  <div class="hero-label">Anime<br/>Anytime</div>
</div>

  <div class="card-wrap">

    <div class="logo">
      <span class="logo-main">anime</span>
      <span class="logo-sub">anytime</span>
    </div>

    <h1>Welcome Back</h1>
    <p class="sub">Sign in to continue your anime journey.</p>

    <div class="field">
      <label for="email">Email Address</label>
      <div class="input-wrap">
        <span class="input-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="3"/><path d="m2 7 10 7 10-7"/>
          </svg>
        </span>
        <input type="email" id="email" placeholder="Enter your email" autocomplete="email"/>
      </div>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="input-wrap">
        <span class="input-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </span>
        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password"/>
        <button class="eye-btn" type="button" onclick="togglePwd(this)" aria-label="Toggle password visibility">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="row-forgot">
      <a href="#" class="link-orange">Forgot password?</a>
    </div>

    <button class="btn-signin" type="button">Sign In</button>

    <div class="divider">or continue with</div>

    <div class="socials">
      <button class="btn-social" aria-label="Continue with Google">
        <svg width="18" height="18" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.2l6.7-6.7C35.7 2.5 30.2 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.8 6C12.3 13.2 17.7 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 7.1-10 7.1-17.5z"/>
          <path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.8-6A24 24 0 0 0 0 24c0 3.8.9 7.4 2.5 10.6l8-5.9z"/>
          <path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.5-5.8c-2 1.4-4.6 2.2-7.7 2.2-6.3 0-11.7-3.7-13.5-9.2l-8 5.9C6.6 42.6 14.6 48 24 48z"/>
        </svg>
      </button>

      <button class="btn-social" aria-label="Continue with Discord">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="#5865F2">
          <path d="M20.3 4.4A19.4 19.4 0 0 0 15.6 3c-.2.4-.5.9-.6 1.3a18 18 0 0 0-5.9 0C8.9 3.9 8.6 3.4 8.4 3A19.4 19.4 0 0 0 3.7 4.4C.5 9.3-.3 14 .1 18.6A19.6 19.6 0 0 0 6 21c.5-.6.9-1.3 1.2-2a12.7 12.7 0 0 1-2-.9l.5-.4a14 14 0 0 0 12.6 0l.5.4c-.6.4-1.3.7-2 .9.3.7.7 1.4 1.2 2a19.6 19.6 0 0 0 5.9-2.4c.5-5.3-.9-9.9-3.6-14.6zM8.2 15.8c-1.3 0-2.3-1.2-2.3-2.6 0-1.4 1-2.6 2.3-2.6s2.3 1.2 2.3 2.6c0 1.4-1 2.6-2.3 2.6zm7.6 0c-1.3 0-2.3-1.2-2.3-2.6 0-1.4 1-2.6 2.3-2.6s2.3 1.2 2.3 2.6c0 1.4-1 2.6-2.3 2.6z"/>
        </svg>
      </button>

      <button class="btn-social" aria-label="Continue with Apple">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.7 9.05 7.4c1.34.07 2.27.74 3.06.78 1.17-.24 2.29-.93 3.55-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.49 4.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
        </svg>
      </button>
    </div>

    <p class="signup-row">Don't have an account? <a href="#">Sign up</a></p>

  </div>
</div>

<script>
  function togglePwd(btn) {
    const input = btn.closest('.input-wrap').querySelector('input');
    const isHidden = input.type === 'password';
    input.type = isHidden ? 'text' : 'password';
    btn.innerHTML = isHidden
      ? `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.9 10.9 0 0 1 12 19C5 19 1 12 1 12a18 18 0 0 1 3.1-4.9M9.9 5.2A10 10 0 0 1 12 5c7 0 11 7 11 7a18 18 0 0 1-2.2 3.2M1 1l22 22"/></svg>`
      : `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
  }
</script>
</body>
</html>
